# AI Engine
ai-engine:
  build:
    context: ./apps/ai-engine
    dockerfile: Dockerfile
  ports:
    - "8000:8000"
  environment:
    - DEVICE=cuda
    - CUDA_VISIBLE_DEVICES=0
    - MODEL_PATH=/models
    - REDIS_URL=redis://redis:6379
  volumes:
    - ai_models:/models
    - ./apps/ai-engine:/app
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  networks:
    - neurotune-network
  depends_on:
    - redis
  restart: unless-stoppedversion: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neurotune
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
