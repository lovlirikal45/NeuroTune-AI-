version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: neurotune-postgres
    environment:
      POSTGRES_DB: neurotune
      POSTGRES_USER: neurotune
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neurotune-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: neurotune-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - neurotune-network

  # AI Engine
  ai-engine:
    build: ./apps/ai-engine
    container_name: neurotune-ai
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/models
    volumes:
      - ./apps/ai-engine:/app
      - ai_models:/models
    depends_on:
      - redis
    networks:
      - neurotune-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: neurotune-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - neurotune-network

networks:
  neurotune-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ai_models: